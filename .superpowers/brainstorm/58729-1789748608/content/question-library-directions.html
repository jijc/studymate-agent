<h2>选择公共题库的视觉方向</h2>
<p class="subtitle">三套方案都沿用 StudyMate 的统一风格，并保留“收藏后自动置顶”。点击图片即可选择。</p>

<div class="cards" style="grid-template-columns: 1fr; gap: 28px;">
  <div class="card" data-choice="1" onclick="toggleSelect(this)">
    <div class="card-body"><h3>方案 1</h3></div>
    <div class="card-image" style="padding: 0; overflow: hidden; background: #fffaf4;">
      <img src="/files/question-library-option-1.png" alt="题库视觉方案 1" style="display:block;width:100%;height:auto;" />
    </div>
  </div>

  <div class="card" data-choice="2" onclick="toggleSelect(this)">
    <div class="card-body"><h3>方案 2</h3></div>
    <div class="card-image" style="padding: 0; overflow: hidden; background: #fffaf4;">
      <img src="/files/question-library-option-2.png" alt="题库视觉方案 2" style="display:block;width:100%;height:auto;" />
    </div>
  </div>

  <div class="card" data-choice="3" onclick="toggleSelect(this)">
    <div class="card-body"><h3>方案 3</h3></div>
    <div class="card-image" style="padding: 0; overflow: hidden; background: #fffaf4;">
      <img src="/files/question-library-option-3.png" alt="题库视觉方案 3" style="display:block;width:100%;height:auto;" />
    </div>
  </div>
</div>
